<!-- ONLY SHOWING IMPORTANT PARTS MODIFIED -->

<script>
let edit=false,currentFolder=null,vaultOpen=false,timer=null;

let db={
  folders:[],
  sap:[],
  vault:[],
  vaultPass:null,
  vacation:{total:20,booked:[],extra:[]},
  notes:"",
  reminders:[] // ✅ NEW
};

async function init(){
  let cloud=await loadFromCloud();
  if(cloud){
    db={...db,...cloud};
    if(!db.reminders) db.reminders=[]; // ✅ ensure exists
  }
  renderFolders();
  showDashboard();
}

function save(){ saveToCloud(db); }

/* REMINDERS FUNCTIONS */
function addReminder(){
  let text=prompt("Reminder");
  if(!text)return;
  db.reminders.push(text);
  save();
  showDashboard();
}

function completeReminder(i){
  db.reminders.splice(i,1);
  save();
  showDashboard();
}

/* DASHBOARD */
function showDashboard(){
  vaultOpen=false;
  clearInterval(timer);

  let used=db.vacation.booked.reduce((a,b)=>a+(+b.days||0),0);
  let extra=db.vacation.extra.reduce((a,b)=>a+(+b.days||0),0);
  let total=(+db.vacation.total||20)+extra;
  let left=total-used;

  let totalLinks=db.folders.reduce((a,f)=>a+(f.links?f.links.length:0),0);

  content.innerHTML=`
    <div class="card pulse">
      <h1 class="glow-title">⚡ Links Dashboard</h1>
      <div class="small">Your personal command center</div>
      <h2 id="clock"></h2>
      <div id="dateInfo" class="small"></div>
    </div>

    <div class="grid">
      <div class="stat"><h3>Folders</h3><div>${db.folders.length}</div></div>
      <div class="stat"><h3>Total Links</h3><div>${totalLinks}</div></div>
      <div class="stat"><h3>SAP Codes</h3><div>${db.sap.length}</div></div>
      <div class="stat"><h3>Vacation Left</h3><div>${left}</div></div>
    </div>

    <!-- ✅ REMINDERS -->
    <div class="card">
      <h2>📝 Reminders</h2>
      <button class="good" onclick="addReminder()">+ Add Reminder</button>

      ${
        db.reminders.length
        ? db.reminders.map((r,i)=>`
          <div class="row">
            <div>
              <input type="checkbox" onclick="completeReminder(${i})">
              ${r}
            </div>
          </div>
        `).join("")
        : "<div class='small'>No reminders yet</div>"
      }
    </div>

    <div class="card">
      <h2>📝 Notes</h2>
      <textarea id="note">${db.notes}</textarea><br>
      <button class="good" onclick="saveNote()">Save Notes</button>
    </div>
  `;

  function tick(){
    const now=new Date();

    clock.innerText=now.toLocaleTimeString("en-CA",{
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit",
      hour12:false
    });

    dateInfo.innerHTML=`
      ${now.toLocaleDateString("en-CA",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}
      <br>Week ${getWeekNumber(now)} • Day ${getDayOfYear(now)} of 365
    `;
  }

  tick();
  timer=setInterval(tick,1000);
}

function saveNote(){
  db.notes=note.value;
  save();
}
</script>
