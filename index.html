<!DOCTYPE html>
<html>
<head>
  <title>Links</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#05060a;
  --panel:rgba(15,18,30,.72);
  --panel2:rgba(255,255,255,.07);
  --cyan:#00f5ff;
  --pink:#ff2bd6;
  --purple:#8b5cf6;
  --green:#22c55e;
  --yellow:#facc15;
  --text:#f8fafc;
  --muted:#94a3b8;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Segoe UI,Arial,sans-serif;
  color:var(--text);
  display:flex;
  min-height:100vh;
  background:
    radial-gradient(circle at 20% 20%, rgba(0,245,255,.22), transparent 28%),
    radial-gradient(circle at 80% 30%, rgba(255,43,214,.18), transparent 30%),
    radial-gradient(circle at 50% 80%, rgba(139,92,246,.20), transparent 28%),
    var(--bg);
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,.08), transparent);
  animation:shine 8s linear infinite;
  pointer-events:none;
}

@keyframes shine{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(100%)}
}

.sidebar{
  width:280px;
  min-height:100vh;
  padding:18px;
  background:rgba(5,8,15,.75);
  backdrop-filter:blur(18px);
  border-right:1px solid rgba(255,255,255,.12);
  box-shadow:0 0 35px rgba(0,245,255,.08);
}

.logo{
  font-size:30px;
  font-weight:800;
  letter-spacing:.5px;
  margin-bottom:18px;
  color:white;
  text-shadow:0 0 18px var(--cyan);
}

.nav button,.add-btn{
  width:100%;
  margin:6px 0;
  padding:11px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;
  background:linear-gradient(135deg, rgba(0,245,255,.12), rgba(255,43,214,.08));
  color:white;
  cursor:pointer;
  text-align:left;
  transition:.25s;
}

.nav button:hover,.add-btn:hover{
  transform:translateX(4px);
  box-shadow:0 0 18px rgba(0,245,255,.35);
}

.folder{
  padding:11px;
  margin:8px 0;
  border-radius:14px;
  background:rgba(255,255,255,.06);
  border-left:4px solid var(--cyan);
  cursor:pointer;
  transition:.25s;
}

.folder:hover{
  background:rgba(0,245,255,.12);
  box-shadow:0 0 15px rgba(0,245,255,.25);
}

.main{
  flex:1;
  padding:26px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  gap:14px;
  align-items:center;
  margin-bottom:16px;
}

.search{
  width:100%;
  max-width:460px;
  padding:13px 16px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.07);
  color:white;
  outline:none;
}

.search:focus{
  box-shadow:0 0 18px rgba(0,245,255,.35);
}

.edit{
  position:fixed;
  right:22px;
  top:22px;
  z-index:9;
  padding:12px 18px;
  border-radius:999px;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  color:white;
  cursor:pointer;
  border:none;
  box-shadow:0 0 22px rgba(255,43,214,.45);
}

.edit.on{
  background:linear-gradient(135deg,var(--green),var(--cyan));
  box-shadow:0 0 22px rgba(34,197,94,.5);
}

.card{
  position:relative;
  overflow:hidden;
  background:var(--panel);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;
  padding:22px;
  margin:16px 0;
  box-shadow:0 0 28px rgba(0,245,255,.10);
  animation:pop .35s ease;
}

.card:before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:24px;
  padding:1px;
  background:linear-gradient(135deg,var(--cyan),var(--pink),var(--purple));
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  opacity:.45;
  pointer-events:none;
}

@keyframes pop{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:16px;
}

.stat{
  background:linear-gradient(135deg,rgba(0,245,255,.12),rgba(255,43,214,.10));
  border:1px solid rgba(255,255,255,.12);
  padding:18px;
  border-radius:20px;
  box-shadow:0 0 18px rgba(139,92,246,.15);
}

.stat h3{margin:0;color:var(--muted);font-size:14px}
.stat div{font-size:28px;font-weight:800;margin-top:8px;color:white}

textarea,input{
  background:rgba(255,255,255,.07);
  color:white;
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;
  padding:12px;
  outline:none;
}

textarea{width:100%;min-height:130px}

button{
  border:none;
  border-radius:12px;
  padding:8px 11px;
  margin:3px;
  cursor:pointer;
  background:rgba(0,245,255,.16);
  color:white;
  transition:.2s;
}

button:hover{
  box-shadow:0 0 14px rgba(0,245,255,.35);
  transform:translateY(-1px);
}

.danger{background:rgba(255,43,43,.22)}
.good{background:rgba(34,197,94,.22)}
.pink{background:rgba(255,43,214,.22)}

.link,.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  padding:12px;
  background:rgba(255,255,255,.06);
  border-radius:16px;
  margin:9px 0;
}

.link a{color:#dffcff;text-decoration:none}
.link a:hover{color:var(--cyan)}

.sap{
  border-left:5px solid var(--pink);
  background:rgba(255,255,255,.06);
  border-radius:18px;
  padding:15px;
  margin:12px 0;
}

.sap-code{
  font-size:22px;
  font-weight:900;
  color:var(--cyan);
  text-shadow:0 0 14px rgba(0,245,255,.45);
}

.sap-desc{color:#cbd5e1;margin-top:5px}
.sap-use{color:var(--yellow);font-size:13px;margin-top:6px}

.vault{
  border:1px solid rgba(255,43,214,.28);
  background:linear-gradient(135deg,rgba(255,43,214,.10),rgba(0,245,255,.08));
  border-radius:20px;
  padding:15px;
  margin:12px 0;
  box-shadow:0 0 20px rgba(255,43,214,.15);
}

.small{color:var(--muted);font-size:13px}

.glow-title{
  text-shadow:0 0 18px var(--cyan),0 0 35px var(--purple);
}

.pinned-link{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  margin:8px 0;
  border-radius:16px;
  background:linear-gradient(135deg,rgba(0,245,255,.12),rgba(255,43,214,.10));
  box-shadow:0 0 16px rgba(0,245,255,.14);
}

.pulse{
  animation:pulseGlow 2s infinite;
}

@keyframes pulseGlow{
  0%{box-shadow:0 0 8px rgba(0,245,255,.25)}
  50%{box-shadow:0 0 24px rgba(255,43,214,.45)}
  100%{box-shadow:0 0 8px rgba(0,245,255,.25)}
}


/* OPERATIONS HUB */
.ops-layout{
  display:grid;
  grid-template-columns:260px 1fr;
  gap:16px;
}
.ops-folder{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:12px;
  margin:8px 0;
  border-radius:16px;
  background:rgba(255,255,255,.06);
  border-left:4px solid var(--purple);
  cursor:pointer;
}
.ops-folder.active{
  background:rgba(0,245,255,.14);
  box-shadow:0 0 18px rgba(0,245,255,.18);
}
.ops-card{
  padding:15px;
  border-radius:18px;
  background:linear-gradient(135deg,rgba(0,245,255,.10),rgba(255,43,214,.08));
  border:1px solid rgba(255,255,255,.12);
  margin:12px 0;
  cursor:pointer;
  transition:.25s;
}
.ops-card:hover{
  transform:translateY(-2px);
  box-shadow:0 0 22px rgba(0,245,255,.28);
}
.ops-card h3{margin:0 0 6px}
.ops-modal-bg{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(12px);
  padding:22px;
}
.ops-modal-bg.show{display:flex;animation:fadeIn .2s ease}
.ops-modal{
  width:min(1100px,96vw);
  max-height:90vh;
  overflow:auto;
  padding:24px;
  border-radius:28px;
  background:linear-gradient(145deg,rgba(12,15,30,.98),rgba(4,6,15,.98));
  border:1px solid rgba(0,245,255,.32);
  box-shadow:0 0 60px rgba(0,245,255,.22);
  animation:modalPop .25s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalPop{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.ops-modal-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:14px;
  margin-bottom:16px;
}
.ops-section{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  padding:16px;
  margin:14px 0;
}
.ops-step{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  padding:16px;
  margin:14px 0;
  border-radius:18px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.10);
}
.ops-img{
  width:100%;
  max-height:280px;
  object-fit:contain;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(0,0,0,.35);
}
.ops-form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.ops-checks{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.ops-checks label{background:rgba(255,255,255,.07);padding:10px 12px;border-radius:14px}
.ops-checks input{width:auto;margin:0 6px 0 0}
.hidden{display:none!important}

@media(max-width:800px){
  body{flex-direction:column}
  .sidebar{width:100%;min-height:auto}
  .main{padding:16px}
  .edit{top:12px;right:12px}
  .ops-layout,.ops-step,.ops-form-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="sidebar">
  <div class="logo">⚡ Links</div>

  <div class="nav">
    <button onclick="showDashboard()">🏠 Dashboard</button>
    <button onclick="showSAP()">🧠 SAP</button>
    <button onclick="showOperations()">⚡ Operations Hub</button>
    <button onclick="openVault()">🔐 Vault</button>
    <button onclick="openVacation()">📅 Vacation</button>
  </div>

  <hr style="border-color:rgba(255,255,255,.12)">

  <h3>📁 Folders</h3>
  <div id="folders"></div>
  <button class="add-btn" onclick="addFolder()">+ Add Folder</button>
</div>

<div class="main">
  <div class="topbar">
    <input class="search" placeholder="Search links, SAP, SOPs, vault, vacation..." oninput="searchAll(this.value)">
  </div>
  <div id="content"></div>
</div>


<div id="opsModalBg" class="ops-modal-bg">
  <div class="ops-modal" id="opsModal"></div>
</div>

<button class="edit" onclick="toggleEdit()" id="editBtn">✏️ EDIT OFF</button>

<script>
let edit=false,currentFolder=null,vaultOpen=false,timer=null;

let db={
  folders:[],
  sap:[],
  vault:[],
  vaultPass:null,
  vaultPassHash:null,
  vacationPassHash:null,
  vacation:{total:20,booked:[],extra:[]},
  ops:{categories:["SAP","Logistics","Troubleshooting","Policies","Warehouse Maps","Emergency Contacts","Inventory Guides"],sops:[]},
  notes:""
};

async function init(){
  let cloud=await loadFromCloud();
  if(cloud){
    db={...db,...cloud};
    if(!db.vacation) db.vacation={total:20,booked:[],extra:[]};
    if(!db.vacation.booked) db.vacation.booked=[];
    if(!db.vacation.extra) db.vacation.extra=[];
    if(!db.ops) db.ops={categories:["SAP","Logistics","Troubleshooting","Policies","Warehouse Maps","Emergency Contacts","Inventory Guides"],sops:[]};
    if(!db.ops.categories) db.ops.categories=[];
    if(!db.ops.sops) db.ops.sops=[];
    if(db.vaultPass && !db.vaultPassHash){
      db.vaultPassHash=await hashPassword(db.vaultPass);
      db.vaultPass=null;
      save();
    }
  }
  if(!db.ops) db.ops={categories:["SAP","Logistics","Troubleshooting","Policies","Warehouse Maps","Emergency Contacts","Inventory Guides"],sops:[]};
  renderFolders();
  showDashboard();
}

function save(){ saveToCloud(db); }

function toggleEdit(){
  edit=!edit;
  editBtn.innerText=edit?"✏️ EDIT ON":"✏️ EDIT OFF";
  editBtn.classList.toggle("on",edit);
  renderFolders();
}

function escapeText(x){
  return String(x ?? "").replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m]));
}

function escapeAttr(x){
  return escapeText(x).replace(/`/g,"&#096;");
}

async function hashPassword(password){
  const encoder=new TextEncoder();
  const data=encoder.encode(password);
  const hashBuffer=await crypto.subtle.digest("SHA-256",data);
  const hashArray=Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function verifyPassword(section,typed){
  const key=section==="Vault"?"vaultPassHash":"vacationPassHash";
  const hash=await hashPassword(typed);
  return hash===db[key];
}

function getWeekNumber(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
}

function getDayOfYear(date){
  const start = new Date(date.getFullYear(),0,0);
  return Math.floor((date - start) / 86400000);
}

/* DASHBOARD */
function showDashboard(){
  vaultOpen=false;
  clearInterval(timer);

  let used=db.vacation.booked.reduce((a,b)=>a+(+b.days||0),0);
  let extra=db.vacation.extra.reduce((a,b)=>a+(+b.days||0),0);
  let total=(+db.vacation.total||20)+extra;
  let left=total-used;
  let totalLinks=db.folders.reduce((a,f)=>a+(f.links?f.links.length:0),0);

  let pinned=[];
  db.folders.forEach((f,fi)=>{
    (f.links||[]).forEach((l,li)=>{
      if(l.pinned){
        pinned.push({...l,folder:f.name,fi,li});
      }
    });
  });

  content.innerHTML=`
    <div class="card pulse">
      <h1 class="glow-title">⚡ Links Dashboard</h1>
      <div class="small">Your personal command center</div>
      <h2 id="clock"></h2>
      <div id="dateInfo" class="small"></div>
    </div>

    <div class="grid">
      <div class="stat"><h3>Folders</h3><div>${db.folders.length}</div></div>
      <div class="stat"><h3>Total Links</h3><div>${totalLinks}</div></div>
      <div class="stat"><h3>SAP Codes</h3><div>${db.sap.length}</div></div>
      <div class="stat"><h3>Vacation Left</h3><div>${left}</div></div>
    </div>

    <div class="card">
      <h2>⭐ Pinned Links</h2>
      ${
        pinned.length
        ? pinned.map(p=>`
          <div class="pinned-link">
            <div>
              <a href="${escapeText(p.url)}" target="_blank">${escapeText(p.name)}</a>
              <div class="small">📁 ${escapeText(p.folder)}</div>
            </div>
          </div>
        `).join("")
        : "<div class='small'>No pinned links yet. Open a folder, turn EDIT ON, and pin links.</div>"
      }
    </div>

    <div class="card">
      <h2>📝 Notes</h2>
      <textarea id="note">${escapeText(db.notes)}</textarea><br>
      <button class="good" onclick="saveNote()">Save Notes</button>
    </div>
  `;

  function tick(){
    const now=new Date();

    clock.innerText=now.toLocaleTimeString("en-CA",{
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit",
      hour12:false
    });

    dateInfo.innerHTML=`
      ${now.toLocaleDateString("en-CA",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}
      <br>Week ${getWeekNumber(now)} • Day ${getDayOfYear(now)} of 365
    `;
  }

  tick();
  timer=setInterval(tick,1000);
}

function saveNote(){
  db.notes=note.value;
  save();
  alert("Notes saved");
}

/* FOLDERS */
function renderFolders(){
  folders.innerHTML="";
  db.folders.forEach((f,i)=>{
    folders.innerHTML+=`
      <div class="folder" onclick="openFolder(${i})">
        <span>📁 ${escapeText(f.name)}</span>
        ${edit?`
          <div>
            <button onclick="event.stopPropagation();editFolder(${i})">✏️</button>
            <button class="danger" onclick="event.stopPropagation();delFolder(${i})">🗑</button>
          </div>`:""}
      </div>`;
  });
}

function addFolder(){
  if(!edit)return alert("Turn EDIT ON first");
  let name=prompt("Folder name");
  if(!name)return;
  db.folders.push({name,links:[]});
  save();renderFolders();
}

function editFolder(i){
  let name=prompt("Folder name",db.folders[i].name);
  if(!name)return;
  db.folders[i].name=name;
  save();renderFolders();openFolder(i);
}

function delFolder(i){
  if(!confirm("Delete this folder and its links?"))return;
  db.folders.splice(i,1);
  currentFolder=null;
  save();renderFolders();showDashboard();
}

function openFolder(i){
  vaultOpen=false;
  clearInterval(timer);
  currentFolder=i;
  let f=db.folders[i];
  if(!f.links)f.links=[];

  content.innerHTML=`
    <div class="card">
      <h1>📁 ${escapeText(f.name)}</h1>
      ${edit?`<button class="good" onclick="addLink()">+ Add Link</button>`:""}
      <div id="linkList"></div>
    </div>
  `;

  linkList.innerHTML=f.links.map((l,idx)=>`
    <div class="link">
      <a href="${escapeText(l.url)}" target="_blank">
        ${l.pinned ? "⭐ " : ""}${escapeText(l.name)}
      </a>
      ${edit?`
        <span>
          <button onclick="togglePin(${idx})">${l.pinned ? "Unpin" : "Pin"}</button>
          <button onclick="editLink(${idx})">✏️</button>
          <button class="danger" onclick="delLink(${idx})">🗑</button>
        </span>`:""}
    </div>
  `).join("");
}

function addLink(){
  let name=prompt("Link name");
  let url=prompt("URL");
  if(!name||!url)return;
  db.folders[currentFolder].links.push({name,url,pinned:false});
  save();openFolder(currentFolder);
}

function editLink(i){
  let l=db.folders[currentFolder].links[i];
  l.name=prompt("Link name",l.name)||l.name;
  l.url=prompt("URL",l.url)||l.url;
  save();openFolder(currentFolder);
}

function delLink(i){
  if(!confirm("Delete this link?"))return;
  db.folders[currentFolder].links.splice(i,1);
  save();openFolder(currentFolder);
}

function togglePin(i){
  let l=db.folders[currentFolder].links[i];
  l.pinned=!l.pinned;
  save();
  openFolder(currentFolder);
}

/* SAP */
function showSAP(){
  vaultOpen=false;
  clearInterval(timer);
  content.innerHTML=`
    <div class="card">
      <h1>🧠 SAP</h1>
      ${edit?`<button class="good" onclick="addSAP()">+ Add SAP</button>`:""}
      <div id="sapList"></div>
    </div>
  `;

  sapList.innerHTML=db.sap.map((s,i)=>`
    <div class="sap">
      <div class="sap-code">${escapeText(s.c)}</div>
      <div class="sap-desc">${escapeText(s.d)}</div>
      <div class="sap-use">${escapeText(s.u)}</div>
      ${edit?`
        <button onclick="editSAP(${i})">✏️ Edit</button>
        <button class="danger" onclick="delSAP(${i})">🗑 Delete</button>`:""}
    </div>
  `).join("");
}

function addSAP(){
  db.sap.push({c:prompt("Code"),d:prompt("Description"),u:prompt("Usage")});
  save();showSAP();
}

function editSAP(i){
  let s=db.sap[i];
  s.c=prompt("Code",s.c)||s.c;
  s.d=prompt("Description",s.d)||s.d;
  s.u=prompt("Usage",s.u)||s.u;
  save();showSAP();
}

function delSAP(i){
  if(!confirm("Delete SAP entry?"))return;
  db.sap.splice(i,1);
  save();showSAP();
}

/* VAULT */
async function openVault(){
  clearInterval(timer);

  if(!db.vaultPassHash){
    let p=prompt("Set vault password");
    if(!p)return;
    db.vaultPassHash=await hashPassword(p);
    db.vaultPass=null;
    save();
  }

  let p=prompt("Enter vault password");
  if(!(await verifyPassword("Vault",p)))return alert("Wrong password");

  vaultOpen=true;
  renderVault();
}

function renderVault(){
  content.innerHTML=`
    <div class="card">
      <h1>🔐 Vault</h1>
      <div class="small">Cyber vault for app usernames and passwords</div>
      ${edit?`
        <button class="good" onclick="addVault()">+ Add Password</button>
        <button class="pink" onclick="changeVaultPass()">Change Vault Password</button>`:""}
      <div id="vaultList"></div>
    </div>
  `;

  vaultList.innerHTML=db.vault.map((v,i)=>`
    <div class="vault">
      <h3>${escapeText(v.name)}</h3>
      <div class="small">Username</div>
      <div>${escapeText(v.user)}</div>
      <div class="small">Password</div>
      <div id="pass${i}">••••••••</div>
      <button onclick="toggleVaultPass(${i})">👁 Show/Hide</button>
      <button onclick="copyPass(${i})">📋 Copy</button>
      ${edit?`
        <button onclick="editVault(${i})">✏️ Edit</button>
        <button class="danger" onclick="delVault(${i})">🗑 Delete</button>`:""}
    </div>
  `).join("");
}

function addVault(){
  db.vault.push({name:prompt("Name"),user:prompt("Username"),pass:prompt("Password")});
  save();renderVault();
}

function editVault(i){
  let v=db.vault[i];
  v.name=prompt("Name",v.name)||v.name;
  v.user=prompt("Username",v.user)||v.user;
  v.pass=prompt("Password",v.pass)||v.pass;
  save();renderVault();
}

function delVault(i){
  if(!confirm("Delete vault entry?"))return;
  db.vault.splice(i,1);
  save();renderVault();
}

function toggleVaultPass(i){
  let el=document.getElementById("pass"+i);
  el.innerText=el.innerText.includes("•")?db.vault[i].pass:"••••••••";
}

function copyPass(i){
  navigator.clipboard.writeText(db.vault[i].pass);
  alert("Password copied");
}

async function changeVaultPass(){
  let old=prompt("Current vault password");
  if(!(await verifyPassword("Vault",old)))return alert("Wrong password");
  let next=prompt("New vault password");
  if(!next)return;
  db.vaultPassHash=await hashPassword(next);
  db.vaultPass=null;
  save();
  alert("Vault password changed");
}

/* VACATION */
async function openVacation(){
  clearInterval(timer);

  if(!db.vacationPassHash){
    let p=prompt("Set vacation password");
    if(!p)return;
    db.vacationPassHash=await hashPassword(p);
    save();
  }

  let p=prompt("Enter vacation password");
  if(!(await verifyPassword("Vacation",p)))return alert("Wrong password");

  showVacation();
}

async function changeVacationPass(){
  let old=prompt("Current vacation password");
  if(!(await verifyPassword("Vacation",old)))return alert("Wrong password");
  let next=prompt("New vacation password");
  if(!next)return;
  db.vacationPassHash=await hashPassword(next);
  save();
  alert("Vacation password changed");
}

function showVacation(){
  vaultOpen=false;
  clearInterval(timer);

  let used=db.vacation.booked.reduce((a,b)=>a+(+b.days||0),0);
  let extra=db.vacation.extra.reduce((a,b)=>a+(+b.days||0),0);
  let total=(+db.vacation.total||20)+extra;
  let left=total-used;

  content.innerHTML=`
    <div class="card">
      <h1>📅 Vacation</h1>
      <div class="grid">
        <div class="stat"><h3>Base Days</h3><div>${db.vacation.total}</div></div>
        <div class="stat"><h3>Extra Days</h3><div>${extra}</div></div>
        <div class="stat"><h3>Booked</h3><div>${used}</div></div>
        <div class="stat"><h3>Remaining</h3><div>${left}</div></div>
      </div>
      ${edit?`
        <button class="good" onclick="addVacation()">+ Book Leave</button>
        <button class="pink" onclick="addExtra()">+ Add Extra Days</button>
        <button onclick="editBaseVacation()">Edit Base Days</button>
        <button class="pink" onclick="changeVacationPass()">Change Vacation Password</button>`:""}
    </div>

    <div class="card">
      <h2>Booked Days</h2>
      ${db.vacation.booked.map((b,i)=>`
        <div class="row">
          <div>📌 ${escapeText(b.date)} | ${escapeText(b.days)} days | ${escapeText(b.reason)}</div>
          ${edit?`<div>
            <button onclick="editVac(${i})">✏️</button>
            <button class="danger" onclick="delVac(${i})">🗑</button>
          </div>`:""}
        </div>`).join("") || "<div class='small'>No bookings yet.</div>"}
    </div>

    <div class="card">
      <h2>Extra Days History</h2>
      ${db.vacation.extra.map((e,i)=>`
        <div class="row">
          <div>➕ ${escapeText(e.days)} days | ${escapeText(e.reason)}</div>
          ${edit?`<div>
            <button onclick="editExtra(${i})">✏️</button>
            <button class="danger" onclick="delExtra(${i})">🗑</button>
          </div>`:""}
        </div>`).join("") || "<div class='small'>No extra days added yet.</div>"}
    </div>
  `;
}

function editBaseVacation(){
  let n=prompt("Base vacation days",db.vacation.total);
  if(!n)return;
  db.vacation.total=+n;
  save();showVacation();
}

function addVacation(){
  db.vacation.booked.push({date:prompt("Date"),days:prompt("Days"),reason:prompt("Reason")});
  save();showVacation();
}

function editVac(i){
  let v=db.vacation.booked[i];
  v.date=prompt("Date",v.date)||v.date;
  v.days=prompt("Days",v.days)||v.days;
  v.reason=prompt("Reason",v.reason)||v.reason;
  save();showVacation();
}

function delVac(i){
  if(!confirm("Delete booking?"))return;
  db.vacation.booked.splice(i,1);
  save();showVacation();
}

function addExtra(){
  db.vacation.extra.push({days:prompt("Extra days"),reason:prompt("Reason")});
  save();showVacation();
}

function editExtra(i){
  let e=db.vacation.extra[i];
  e.days=prompt("Extra days",e.days)||e.days;
  e.reason=prompt("Reason",e.reason)||e.reason;
  save();showVacation();
}

function delExtra(i){
  if(!confirm("Delete extra days record?"))return;
  db.vacation.extra.splice(i,1);
  save();showVacation();
}


/* OPERATIONS HUB */
let currentOpsCategory=null;
let currentSopId=null;
let editingSopId=null;

function ensureOps(){
  if(!db.ops) db.ops={categories:["SAP","Logistics","Troubleshooting","Policies","Warehouse Maps","Emergency Contacts","Inventory Guides"],sops:[]};
  if(!db.ops.categories) db.ops.categories=[];
  if(!db.ops.sops) db.ops.sops=[];
  if(!currentOpsCategory) currentOpsCategory=db.ops.categories[0]||"";
}

function showOperations(){
  vaultOpen=false;
  clearInterval(timer);
  ensureOps();
  content.innerHTML=`
    <div class="card pulse">
      <h1 class="glow-title">⚡ Operations Hub</h1>
      <div class="small">SOPs, troubleshooting, policies, process flows, warehouse maps, emergency contacts, and inventory guides.</div>
    </div>

    <div class="ops-layout">
      <div class="card">
        <h2>📁 Operations Folders</h2>
        ${edit?`<button class="good" onclick="addOpsCategory()">+ Add Folder</button>`:""}
        <div id="opsCategories"></div>
      </div>

      <div class="card">
        <div class="topbar">
          <h2 style="margin:0">📄 SOPs</h2>
          ${edit?`<button class="good" onclick="openSopEditor()">+ Add SOP</button>`:""}
        </div>
        <input class="search" style="max-width:none;margin-bottom:12px" id="opsSearch" placeholder="Search SOPs live..." oninput="renderOpsSops()">
        <div id="opsSops"></div>
      </div>
    </div>
  `;
  renderOpsCategories();
  renderOpsSops();
}

function renderOpsCategories(){
  ensureOps();
  opsCategories.innerHTML=db.ops.categories.map((cat,i)=>`
    <div class="ops-folder ${cat===currentOpsCategory?'active':''}" onclick="selectOpsCategory('${escapeAttr(cat)}')">
      <span>📁 ${escapeText(cat)}</span>
      ${edit?`<span>
        <button onclick="event.stopPropagation();renameOpsCategory(${i})">✏️</button>
        <button class="danger" onclick="event.stopPropagation();deleteOpsCategory(${i})">🗑</button>
      </span>`:""}
    </div>
  `).join("") || "<div class='small'>No folders yet.</div>";
}

function selectOpsCategory(cat){
  currentOpsCategory=cat;
  renderOpsCategories();
  renderOpsSops();
}

function addOpsCategory(){
  if(!edit)return alert("Turn EDIT ON first");
  let name=prompt("Operations folder name");
  if(!name)return;
  ensureOps();
  db.ops.categories.push(name);
  currentOpsCategory=name;
  save();showOperations();
}

function renameOpsCategory(i){
  let old=db.ops.categories[i];
  let name=prompt("Folder name",old);
  if(!name)return;
  db.ops.categories[i]=name;
  db.ops.sops.forEach(s=>{if(s.category===old)s.category=name});
  currentOpsCategory=name;
  save();showOperations();
}

function deleteOpsCategory(i){
  let cat=db.ops.categories[i];
  if(!confirm("Delete this Operations folder and SOPs inside it?"))return;
  db.ops.categories.splice(i,1);
  db.ops.sops=db.ops.sops.filter(s=>s.category!==cat);
  currentOpsCategory=db.ops.categories[0]||"";
  save();showOperations();
}

function renderOpsSops(){
  ensureOps();
  let q=(document.getElementById("opsSearch")?.value||"").toLowerCase();
  let list=db.ops.sops.filter(s=>{
    let text=`${s.title||""} ${s.quickFix||""} ${s.problem||""} ${s.sapCodes||""}`.toLowerCase();
    return s.category===currentOpsCategory && text.includes(q);
  });

  opsSops.innerHTML=list.map(s=>`
    <div class="ops-card" onclick="openSopViewer('${s.id}')">
      <h3>${escapeText(s.title)}</h3>
      <div class="small">${s.quickFix?"⚡ Quick fix available":"📄 SOP guide"}</div>
    </div>
  `).join("") || "<div class='small'>No SOPs found in this folder.</div>";
}

function openSopViewer(id){
  let s=db.ops.sops.find(x=>x.id===id);
  if(!s)return;
  currentSopId=id;

  opsModal.innerHTML=`
    <div class="ops-modal-top">
      <div>
        <h1 style="margin:0">${escapeText(s.title)}</h1>
        <div class="small">📁 ${escapeText(s.category)}</div>
      </div>
      <div>
        ${edit?`<button onclick="openSopEditor('${s.id}')">✏️ Edit</button><button class="danger" onclick="deleteSop('${s.id}')">🗑 Delete</button>`:""}
        <button onclick="closeOpsModal()">Close</button>
      </div>
    </div>
    ${s.quickFix?`<div class="ops-section"><h2>⚡ Quick Fix</h2><div>${escapeText(s.quickFix)}</div></div>`:""}
    ${s.problem?`<div class="ops-section"><h2>Problem / Issue</h2><div>${escapeText(s.problem)}</div></div>`:""}
    ${s.sapCodes?`<div class="ops-section"><h2>SAP Codes</h2><div class="sap-code">${escapeText(s.sapCodes)}</div></div>`:""}
    <div class="ops-section">
      <h2>Steps</h2>
      ${(s.steps||[]).map((step,i)=>`
        <div class="ops-step">
          <div>
            <h3>Step ${i+1}</h3>
            <div style="line-height:1.65">${escapeText(step.text)}</div>
          </div>
          <div>${step.image?`<img class="ops-img" src="${step.image}">`:`<div class="ops-img" style="display:flex;align-items:center;justify-content:center;color:var(--muted)">No image added</div>`}</div>
        </div>
      `).join("")}
    </div>
  `;
  opsModalBg.classList.add("show");
}

function closeOpsModal(){opsModalBg.classList.remove("show")}

function openSopEditor(id=null){
  if(!edit)return alert("Turn EDIT ON first");
  ensureOps();
  editingSopId=id;
  let s=db.ops.sops.find(x=>x.id===id) || {title:"",category:currentOpsCategory,quickFix:"",problem:"",sapCodes:"",steps:[{text:"",image:""}]};

  opsModal.innerHTML=`
    <div class="ops-modal-top">
      <h1 style="margin:0">${id?"Edit SOP":"Add SOP"}</h1>
      <button onclick="closeOpsModal()">Close</button>
    </div>

    <div class="ops-form-grid">
      <div><div class="small">Title</div><input id="sopTitle" value="${escapeAttr(s.title)}" placeholder="Example: How to fix trailer number issue"></div>
      <div><div class="small">Folder</div><select id="sopCategory">${db.ops.categories.map(c=>`<option ${c===s.category?'selected':''}>${escapeText(c)}</option>`).join("")}</select></div>
    </div>

    <div class="ops-checks">
      <label><input type="checkbox" id="toggleQuickFix" ${s.quickFix?'checked':''} onchange="toggleSopOptional()"> Add Quick Fix</label>
      <label><input type="checkbox" id="toggleProblem" ${s.problem?'checked':''} onchange="toggleSopOptional()"> Add Problem</label>
      <label><input type="checkbox" id="toggleSapCodes" ${s.sapCodes?'checked':''} onchange="toggleSopOptional()"> Add SAP Codes</label>
    </div>

    <div id="quickFixBox"><div class="small">Quick Fix</div><textarea id="sopQuickFix" placeholder="Simple quick fix...">${escapeText(s.quickFix)}</textarea></div>
    <div id="problemBox"><div class="small">Problem / Issue</div><textarea id="sopProblem" placeholder="Only add this if needed...">${escapeText(s.problem)}</textarea></div>
    <div id="sapCodesBox"><div class="small">SAP Codes</div><input id="sopSapCodes" value="${escapeAttr(s.sapCodes)}" placeholder="Example: VL02N, MIGO, LT01"></div>

    <h2>Steps + Images</h2>
    <div id="sopStepsEditor"></div>
    <button onclick="addSopStep()">+ Add Step</button>

    <div style="text-align:right;margin-top:18px">
      <button onclick="closeOpsModal()">Cancel</button>
      <button class="good" onclick="saveSop()">Save SOP</button>
    </div>
  `;
  renderSopStepsEditor(s.steps&&s.steps.length?s.steps:[{text:"",image:""}]);
  toggleSopOptional();
  opsModalBg.classList.add("show");
}

function toggleSopOptional(){
  quickFixBox.classList.toggle("hidden",!toggleQuickFix.checked);
  problemBox.classList.toggle("hidden",!toggleProblem.checked);
  sapCodesBox.classList.toggle("hidden",!toggleSapCodes.checked);
}

function renderSopStepsEditor(steps){
  sopStepsEditor.innerHTML=steps.map((step,i)=>`
    <div class="ops-step sop-step-edit">
      <div>
        <h3>Step ${i+1}</h3>
        <textarea class="sopStepText" placeholder="Write step instruction...">${escapeText(step.text)}</textarea>
        <button class="danger" onclick="removeSopStep(${i})">Remove Step</button>
      </div>
      <div>
        ${step.image?`<img class="ops-img" src="${step.image}">`:`<div class="ops-img" style="display:flex;align-items:center;justify-content:center;color:var(--muted)">Image preview</div>`}
        <input type="file" accept="image/*" onchange="uploadSopImage(event,${i})">
        <input type="hidden" class="sopStepImage" value="${step.image||""}">
      </div>
    </div>
  `).join("");
}

function getSopStepsFromEditor(){
  return [...document.querySelectorAll(".sop-step-edit")].map(block=>({
    text:block.querySelector(".sopStepText").value,
    image:block.querySelector(".sopStepImage").value
  }));
}

function addSopStep(){
  let steps=getSopStepsFromEditor();
  steps.push({text:"",image:""});
  renderSopStepsEditor(steps);
}

function removeSopStep(i){
  let steps=getSopStepsFromEditor();
  steps.splice(i,1);
  renderSopStepsEditor(steps.length?steps:[{text:"",image:""}]);
}

function uploadSopImage(e,i){
  let file=e.target.files[0];
  if(!file)return;
  let reader=new FileReader();
  reader.onload=function(ev){
    let steps=getSopStepsFromEditor();
    steps[i].image=ev.target.result;
    renderSopStepsEditor(steps);
  };
  reader.readAsDataURL(file);
}

function saveSop(){
  let title=sopTitle.value.trim();
  if(!title)return alert("SOP title is required");

  let item={
    id:editingSopId||crypto.randomUUID(),
    title,
    category:sopCategory.value,
    quickFix:toggleQuickFix.checked?sopQuickFix.value.trim():"",
    problem:toggleProblem.checked?sopProblem.value.trim():"",
    sapCodes:toggleSapCodes.checked?sopSapCodes.value.trim():"",
    steps:getSopStepsFromEditor().filter(x=>x.text.trim()||x.image)
  };
  if(!item.steps.length)item.steps=[{text:"No steps added yet.",image:""}];

  if(editingSopId){
    db.ops.sops=db.ops.sops.map(x=>x.id===editingSopId?item:x);
  }else{
    db.ops.sops.push(item);
  }
  currentOpsCategory=item.category;
  save();
  closeOpsModal();
  showOperations();
}

function deleteSop(id){
  if(!confirm("Delete this SOP?"))return;
  db.ops.sops=db.ops.sops.filter(x=>x.id!==id);
  save();
  closeOpsModal();
  showOperations();
}

/* SEARCH */
function searchAll(q){
  q=q.toLowerCase().trim();
  if(!q){showDashboard();return;}

  clearInterval(timer);
  let results=[];

  db.folders.forEach(f=>{
    if(f.name.toLowerCase().includes(q)) results.push(`📁 Folder: ${escapeText(f.name)}`);
    (f.links||[]).forEach(l=>{
      if((l.name+l.url).toLowerCase().includes(q)){
        results.push(`🔗 <a href="${escapeText(l.url)}" target="_blank">${escapeText(l.name)}</a>`);
      }
    });
  });

  db.sap.forEach(s=>{
    if((s.c+s.d+s.u).toLowerCase().includes(q)) results.push(`🧠 ${escapeText(s.c)} - ${escapeText(s.d)}`);
  });

  if(db.ops){
    db.ops.categories.forEach(c=>{
      if(c.toLowerCase().includes(q)) results.push(`⚡ Operations Folder: ${escapeText(c)}`);
    });
    db.ops.sops.forEach(s=>{
      if(((s.title||"")+(s.quickFix||"")+(s.problem||"")+(s.sapCodes||"")).toLowerCase().includes(q)){
        results.push(`📄 SOP: ${escapeText(s.title)} <span class="small">(${escapeText(s.category)})</span>`);
      }
    });
  }

  db.vault.forEach(v=>{
    if((v.name+v.user).toLowerCase().includes(q)) results.push(`🔐 ${escapeText(v.name)} - ${escapeText(v.user)}`);
  });

  content.innerHTML=`
    <div class="card">
      <h1>🔍 Search Results</h1>
      ${results.map(r=>`<div class="row">${r}</div>`).join("") || "<div class='small'>No results found.</div>"}
    </div>`;
}
</script>
